<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Video - AI Video Studio</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

header {
    padding: 18px;
    border-bottom: 1px solid #29314a;
}

.back {
    color: white;
    text-decoration: none;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #aeb5c9;
    line-height: 1.5;
}

.box {
    background: #12182b;
    border: 1px solid #29314a;
    border-radius: 16px;
    padding: 22px;
    margin-top: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

textarea,
select,
input[type="file"] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #3a435f;
    background: #0b1020;
    color: white;
    margin-bottom: 20px;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

.duration {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.duration button {
    padding: 12px 5px;
    background: #18213a;
    color: white;
    border: 1px solid #3a435f;
    border-radius: 9px;
    cursor: pointer;
}

.duration button.active {
    border-color: #6d86ff;
    background: #26345d;
}

.generate {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: #4969ff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.generate:hover {
    background: #5d78ff;
}

.advanced {
    margin-top: 20px;
}

.advanced summary {
    cursor: pointer;
    font-weight: bold;
}

.option {
    margin-top: 20px;
}

.notice {
    margin-top: 15px;
    color: #9fa8c0;
    font-size: 14px;
    line-height: 1.5;
}

@media(max-width:600px) {
    .duration {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <a class="back" href="index.html">← Back to Home</a>
</header>

<main>

<h1>🎬 Create Video</h1>

<p class="subtitle">
Turn your story, script or image into an AI-generated video.
</p>

<div class="box">

<label for="story">Write Your Story or Paste Script</label>

<textarea id="story"
placeholder="Example:

Aisha walks through a beautiful village.
She meets Aminu and they start talking.
Later, they travel together to the city."></textarea>

<label for="image">Upload Image (Optional)</label>

<input type="file" id="image" accept="image/*">

<label for="language">Language</label>

<select id="language">
<option>English</option>
<option>Hausa</option>
<option>Arabic</option>
<option>French</option>
<option>Spanish</option>
<option>Portuguese</option>
<option>German</option>
<option>Chinese</option>
<option>Hindi</option>
<option>Japanese</option>
<option>Korean</option>
<option>Italian</option>
</select>

<label>Video Duration</label>

<div class="duration">

<button onclick="setDuration(this,'30 seconds')">30s</button>
<button onclick="setDuration(this,'1 minute')">1m</button>
<button onclick="setDuration(this,'3 minutes')">3m</button>
<button onclick="setDuration(this,'5 minutes')">5m</button>
<button onclick="setDuration(this,'10 minutes')">10m</button>

</div>

<p class="notice">
The AI will automatically understand your story and organize it into scenes.
</p>

<label for="style">Video Style</label>

<select id="style">
<option>Realistic</option>
<option>Cinematic</option>
<option>Anime</option>
<option>3D Animation</option>
<option>Cartoon</option>
<option>Documentary</option>
</select>

<details class="advanced">

<summary>⚙️ Advanced Settings</summary>

<div class="option">

<label>Character Lock</label>

<select>
<option>On</option>
<option>Off</option>
</select>

</div>

<div class="option">

<label>Voice Lock</label>

<select>
<option>On</option>
<option>Off</option>
</select>

</div>

<div class="option">

<label>Voice / Dialogue</label>

<select>
<option>Characters speak their dialogue</option>
<option>Voice-over narration</option>
<option>Both</option>
<option>None</option>
</select>

</div>

<div class="option">

<label>Subtitles</label>

<select>
<option>On</option>
<option>Off</option>
</select>

</div>

<div class="option">

<label>Background Music</label>

<select>
<option>Auto</option>
<option>On</option>
<option>Off</option>
</select>

</div>

</details>

<button class="generate" onclick="generateVideo()">
🚀 Generate Video
</button>

<p id="message" class="notice"></p>

</div>

</main>

<script>

let selectedDuration = "";

function setDuration(button, duration) {

    document.querySelectorAll(".duration button")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    selectedDuration = duration;
}

function generateVideo() {

    const story = document.getElementById("story").value.trim();
    const message = document.getElementById("message");

    if (story === "") {

        message.textContent =
        "Please write your story or paste your script first.";

        return;
    }

    if (selectedDuration === "") {

        message.textContent =
        "Please select a video duration.";

        return;
    }

    message.textContent =
    "✅ Your video request is ready. AI generation engine will be connected next.";

}

</script>

</body>
</html>
