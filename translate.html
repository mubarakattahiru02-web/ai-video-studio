<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Translate Video - AI Video Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #111827;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .back {
      border: none;
      background: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    h1 {
      font-size: 28px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    .info {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 12px;
      color: #166534;
      line-height: 1.5;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .option {
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 12px;
      padding: 15px 8px;
      cursor: pointer;
      text-align: center;
    }

    .option.active {
      background: #111827;
      color: white;
    }

    .option-icon {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .translate-btn {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 17px;
      border-radius: 13px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .options {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <button class="back" onclick="goHome()">← Back</button>
      <h1>Translate Video</h1>
    </div>

    <p class="subtitle">
      Upload a video and translate its speech and subtitles into another language.
    </p>


    <div class="card">

      <label>🎬 Upload Video</label>

      <input
        type="file"
        id="video"
        accept="video/*"
      >

    </div>


    <div class="card">

      <label>🔎 Source Language</label>

      <div class="info">
        🤖 AI will automatically detect the language spoken in your video.
      </div>

    </div>


    <div class="card">

      <label>🌍 Translate To</label>

      <select id="targetLanguage">

        <option value="English">English</option>
        <option value="Hausa">Hausa</option>
        <option value="Arabic">Arabic</option>
        <option value="French">French</option>
        <option value="Spanish">Spanish</option>
        <option value="Portuguese">Portuguese</option>
        <option value="German">German</option>
        <option value="Chinese">Chinese</option>
        <option value="Hindi">Hindi</option>
        <option value="Japanese">Japanese</option>
        <option value="Korean">Korean</option>
        <option value="Italian">Italian</option>

      </select>

    </div>


    <div class="card">

      <label>🎙️ Translation Output</label>

      <div class="options">

        <button
          class="option active"
          onclick="selectOption(this, 'voice')"
        >
          <div class="option-icon">🎙️</div>
          Voice-over
        </button>

        <button
          class="option"
          onclick="selectOption(this, 'subtitles')"
        >
          <div class="option-icon">💬</div>
          Subtitles
        </button>

        <button
          class="option"
          onclick="selectOption(this, 'both')"
        >
          <div class="option-icon">🎬</div>
          Both
        </button>

      </div>

    </div>


    <div class="card">

      <label>🔊 Voice</label>

      <select id="voice">

        <option>AI Natural Voice</option>
        <option>Male Voice</option>
        <option>Female Voice</option>

      </select>

    </div>


    <button
      class="translate-btn"
      onclick="translateVideo()"
    >
      🌍 Translate Video
    </button>

  </div>


  <script>

    let selectedOutput = "voice";

    function selectOption(button, option) {

      document.querySelectorAll(".option").forEach(function(btn) {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      selectedOutput = option;
    }


    function goHome() {

      window.location.href = "index.html";

    }


    function translateVideo() {

      const video = document.getElementById("video").files[0];

      if (!video) {

        alert("Please upload a video first.");

        return;

      }

      const language =
        document.getElementById("targetLanguage").value;

      alert(
        "Translation request is ready!\n\n" +
        "Translate to: " + language +
        "\n" +
        "Output: " + selectedOutput +
        "\n\n" +
        "The real AI translation engine will be connected next."
      );

    }

  </script>

</body>
  </html>
